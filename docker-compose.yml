version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: app-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: app-backend-postgre
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app

volumes:
  pg_data:
